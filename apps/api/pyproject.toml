[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "PabSdev", email = "ps701702@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "async>=0.6.2",
    "basedpyright>=1.40.2",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.165.0",
    "psycopg[binary]>=3.3.9",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6", 
    "pre-commit>=4.7.0",

]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.basedpyright]
extraPaths = ["src"]
